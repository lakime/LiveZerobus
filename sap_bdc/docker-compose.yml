# sap-bdc as a standalone Delta Sharing server with auto-HTTPS via Caddy.
#
#   docker compose up --build -d
#
# Required env vars (in .env or exported):
#   SAP_BDC_TOKEN  — random bearer token for Delta Sharing clients
#   PUBLIC_HOST    — your domain, e.g. sap-bdc.example.com (no scheme)
#   ACME_EMAIL     — email for Let's Encrypt expiry notices

services:
  sap-bdc:
    build: .
    container_name: sap-bdc
    expose:
      - "8000"
    environment:
      SAP_BDC_TOKEN: ${SAP_BDC_TOKEN}
      # HOST must match the public URL so signed parquet URLs work
      HOST: https://${PUBLIC_HOST}
      DATA_DIR: /data
    volumes:
      - sap-bdc-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: sap-bdc-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - sap-bdc
    restart: unless-stopped

volumes:
  sap-bdc-data:
  caddy-data:
  caddy-config:
