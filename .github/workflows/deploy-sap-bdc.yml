# Continuous deployment of the sap-bdc Databricks App (SAP Business Data Cloud mock).
# Independent from the livezerobus deploy workflow.
#
# Triggers:
#   * push to main         — on changes under sap_bdc/
#   * workflow_dispatch    — manual trigger from any branch
name: deploy-sap-bdc

on:
  push:
    branches: [main]
    paths:
      - "sap_bdc/**"
      - ".github/workflows/deploy-sap-bdc.yml"
  workflow_dispatch:

concurrency:
  group: deploy-sap-bdc-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: sap-bdc
  DATABRICKS_HOST:          ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID:     ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

jobs:
  deploy:
    name: Build + deploy sap-bdc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sap_bdc/frontend/package-lock.json

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Build frontend
        run: |
          cd sap_bdc/frontend
          npm ci
          npm run build

      - name: Resolve workspace path
        id: ws
        run: |
          WS_USER="$(databricks current-user me --output json | python3 -c 'import json,sys;print(json.load(sys.stdin)["userName"])')"
          echo "path=/Workspace/Users/${WS_USER}/${APP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Sync sap_bdc/ → workspace
        # Fast bulk upload (parallel). May skip non-notebook files; we fix
        # that by explicitly importing app.yaml in the next step.
        run: |
          databricks sync --full \
            ./sap_bdc \
            "${{ steps.ws.outputs.path }}"

      - name: Import app.yaml explicitly
        # databricks sync may drop YAML files; import directly to be safe.
        run: |
          databricks workspace import \
            --format AUTO --overwrite \
            --file ./sap_bdc/app.yaml \
            "${{ steps.ws.outputs.path }}/app.yaml"

      - name: Upload frontend/dist → workspace
        # databricks sync respects .gitignore which excludes frontend/dist/.
        # Use import-dir to force-upload the React bundle from npm run build.
        run: |
          databricks workspace import-dir --overwrite \
            ./sap_bdc/frontend/dist \
            "${{ steps.ws.outputs.path }}/frontend/dist"

      - name: Deploy app
        run: |
          databricks apps deploy "${APP_NAME}" \
            --source-code-path "${{ steps.ws.outputs.path }}"
