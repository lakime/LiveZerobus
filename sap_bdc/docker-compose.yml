# sap-bdc as a standalone Delta Sharing server.
#
# Designed for setups where TLS termination + public DNS happen upstream
# (e.g. external Nginx reverse proxy via WireGuard). This compose only
# exposes plain HTTP on port 8000 — secure it at the upstream layer.
#
# Required env vars (in .env or exported):
#   SAP_BDC_TOKEN   — random bearer token for Delta Sharing clients
#   PUBLIC_HOST     — full URL the world sees, e.g. https://sap-bdc.example.com
#                     (this is what Databricks UC reads from profile.json)
#
# Run:    docker compose up --build -d
# Logs:   docker compose logs -f
# Stop:   docker compose down

services:
  sap-bdc:
    build: .
    container_name: sap-bdc
    ports:
      # Bind to all interfaces so WireGuard peers can reach it.
      # If you want to restrict to WireGuard only, use:
      #   - "10.x.x.x:8000:8000"   (the VPS's wireguard IP)
      - "8000:8000"
    environment:
      SAP_BDC_TOKEN: ${SAP_BDC_TOKEN}
      # HOST must be the externally-reachable URL — used to build signed
      # Parquet file URLs that Databricks UC will fetch.
      HOST: ${PUBLIC_HOST}
      DATA_DIR: /data
    volumes:
      - sap-bdc-data:/data
    restart: unless-stopped

volumes:
  sap-bdc-data:
